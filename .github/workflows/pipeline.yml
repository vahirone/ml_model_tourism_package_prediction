%%writefile .github/workflows/pipeline.yml
name: Tourism Project Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:

  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Register Dataset
        run: python tourism_project/model_building/data_register.py
      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Run Data Preparation
        run: python tourism_project/model_building/prep.py
      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            tourism_project/data/Xtrain.csv
            tourism_project/data/Xtest.csv
            tourism_project/data/ytrain.csv
            tourism_project/data/ytest.csv
            tourism_project/deployment/encoders.joblib

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: artifact
      - name: Restore Generated Files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tourism_project/data tourism_project/deployment
          for file in Xtrain.csv Xtest.csv ytrain.csv ytest.csv; do
            source=$(find artifact -type f -name "$file" -print -quit)
            test -n "$source"
            cp "$source" "tourism_project/data/$file"
          done
          encoder=$(find artifact -type f -name encoders.joblib -print -quit)
          test -n "$encoder"
          cp "$encoder" tourism_project/deployment/encoders.joblib
          test -f tourism_project/deployment/encoders.joblib
      - name: Start MLflow Server
        run: |
          nohup mlflow ui --host 0.0.0.0 --port 5000 &
          sleep 5
      - name: Model Building
        run: python tourism_project/model_building/train.py
      - name: Commit Trained Model and Encoders
        shell: bash
        run: |
          set -euo pipefail
          test -f tourism_project/deployment/model.joblib
          test -f tourism_project/deployment/encoders.joblib
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f tourism_project/deployment/model.joblib tourism_project/deployment/encoders.joblib
          git diff --cached --quiet || git commit -m "Add trained model [skip ci]"
          git push
